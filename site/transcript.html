<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$label · RamyAura Field Notes</title>
  <meta name="description" content="$description">
  <link rel="stylesheet" href="../style.css?v={{edition}}">
</head>
<body>
<a class="skip" href="#reading">Skip to $section_name</a>
<header class="mast"><div class="wrap mast-inner"><a class="brand" href="../"><strong>RamyAura</strong> Field Notes</a><nav aria-label="Main"><a href="../">Library</a><a href="../study.html">Study guide</a></nav></div></header>
<main class="wrap reader">
  <header class="reader-intro"><p class="kicker">$kind · <time datetime="$date">$display_date</time></p>
    <h1>$label</h1>$original_title
    <a href="$video_url">Watch on YouTube · $duration</a>
  </header>
  $chapters
  <section id="reading"><h2>$section_name</h2><p class="reading-note">$note</p>
    $passages
  </section>
</main>
<footer><div class="wrap"><a href="../">Browse the matchup library</a> · <a href="$source_url">Transcript notes on GitHub</a></div></footer>
</body></html>
