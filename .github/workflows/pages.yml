name: Publish field notes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/build_pages.py "$RUNNER_TEMP/field-notes"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/field-notes
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
